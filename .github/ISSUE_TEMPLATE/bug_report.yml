name: Bug report
description: Report an observed problem with safe, reproducible details.
labels:
  - type:bug
  - status:needs-review
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Do not include secrets, personal data, or local paths. Report only sanitized impact in this public form, and do not include exploitable details.
  - type: textarea
    id: bug_summary
    attributes:
      label: Summary
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: bug_actual_behavior
    attributes:
      label: Actual behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: bug_expected_behavior
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: bug_reproduction
    attributes:
      label: Reproduction and frequency
      description: Provide the smallest safe sequence that shows the problem and how often it occurs.
    validations:
      required: true
  - type: textarea
    id: bug_environment
    attributes:
      label: Environment
      description: Provide the app revision or version, Android or API version, device or emulator, build variant, and relevant server version.
    validations:
      required: true
  - type: dropdown
    id: bug_areas
    attributes:
      label: Affected areas
      description: Select every area that is affected.
      multiple: true
      options:
        - area:android
        - area:architecture
        - area:auth
        - area:discovery
        - area:navidrome
        - area:offline
        - area:playback
        - area:security
        - area:server
        - area:testing
        - area:ui
        - Other / cross-cutting
    validations:
      required: true
  - type: textarea
    id: bug_acceptance
    attributes:
      label: Observable acceptance and definition of done
      description: Describe the observable result that would demonstrate the problem is fixed and how it should be verified.
    validations:
      required: true
  - type: dropdown
    id: bug_openspec_impact
    attributes:
      label: OpenSpec impact
      options:
        - No specification change expected
        - Existing behavior/specification must change
        - New capability/specification may be needed
        - Unsure — maintainer review needed
    validations:
      required: true
  - type: textarea
    id: bug_security_privacy
    attributes:
      label: Sanitized security or privacy impact
      description: Describe any security or privacy impact without exploitable details, secrets, or personal data. Enter "None known" when applicable.
    validations:
      required: true
  - type: textarea
    id: bug_diagnostics
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Remove secrets, personal data, endpoints, and local paths before sharing.
      placeholder: Paste sanitized diagnostics or describe an image.
    validations:
      required: false
  - type: textarea
    id: bug_context
    attributes:
      label: Additional context
      description: Optional. Add any other safe, relevant context.
    validations:
      required: false
  - type: checkboxes
    id: bug_duplicate_check
    attributes:
      label: Duplicate check
      options:
        - label: I searched existing issues for duplicates.
          required: true
  - type: checkboxes
    id: bug_safe_disclosure
    attributes:
      label: Safe disclosure
      options:
        - label: I removed secrets, credentials, tokens, personal data, private endpoints, and local paths.
          required: true
